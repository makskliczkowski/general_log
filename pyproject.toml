[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "general-log"
version = "2.1.0"
description = "Colored, verbosity-aware console and file logging helpers for Python projects."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Maksymilian Kliczkowski", email = "maksymilian.kliczkowski@pwr.edu.pl" },
]
keywords = ["logging", "log", "console", "color", "ansi", "notebook"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Color is optional: the library degrades to plain text output without it.
color = ["colorama>=0.4; platform_system == 'Windows'"]
dev = [
    "pytest>=7",
    "mypy>=1.8",
    "ruff>=0.4",
]

[tool.setuptools]
packages = ["general_log"]

[tool.setuptools.package-data]
general_log = ["py.typed"]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # long alignment is intentional (see AGENTS.md)

[tool.mypy]
python_version = "3.10"
strict = true
